name: Build Simple Dylib
on:
push:
branches: [ main, master ]
pull_request:
branches: [ main, master ]
jobs:
build:
runs-on: macos-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4
- name: Compile Dylib
run: |
mkdir -p packages
clang -dynamiclib main.m -o packages/MeluxHarper.dylib -framework Foundation -framework UIKit -framework WebKit -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path)
- name: Upload Artifact
uses: actions/upload-artifact@v4
with:
name: MeluxHarper-Dylib
path: packages/*.dylib
